<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a140e">
  <meta name="description" content="A living procedural forest. Tap to plant trees, look around with touch, and tilt your device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>森をつくる — Grow a Forest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a140e'/%3E%3Cpath d='M32 9 14 35h11l-7 12h28l-7-12h11L32 9Z' fill='%237fae5c'/%3E%3Cpath d='M32 43v12' stroke='%23f2d6a2' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="インタラクティブな森。タップして木を植えられます。"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="loader" id="loader" aria-live="polite">
      <div class="loader-inner">
        <div class="loader-mark">森</div>
        <p>森を育てています</p>
        <div class="loader-line"><span></span></div>
      </div>
    </div>

    <header class="hud-top">
      <div class="brand">
        <h1>森をつくる</h1>
        <p>GROW A FOREST</p>
      </div>
      <div class="actions">
        <button class="pill icon-pill" id="sound" type="button" aria-label="音をオンにする" aria-pressed="false" title="音">
          <svg class="icon icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18V6L7.2 9.5H4Z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path class="wave" d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
          <svg class="icon icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18V6L7.2 9.5H4Z"/><path d="m16 9.5 5 5m0-5-5 5"/></svg>
          <span class="pill-label">音</span>
        </button>
        <button class="pill icon-pill" id="tilt" type="button" aria-label="端末の傾きをオンにする" aria-pressed="false" title="傾き">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="2.8" width="9" height="15.5" rx="2"/><path d="M10.5 5.5h3"/><path d="M4 8.5c-1 2.2-1 4.8 0 7"/><path d="M20 8.5c1 2.2 1 4.8 0 7"/></svg>
          <span class="pill-label">傾き</span>
        </button>
        <button class="pill icon-pill" id="reset" type="button" aria-label="植えた木をリセット" title="リセット">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
          <span class="pill-label">リセット</span>
        </button>
      </div>
    </header>

    <div class="hint" id="hint">
      <span class="hint-touch">タップして木を植える <i>·</i> ドラッグで見わたす <i>·</i> ピンチで近づく</span>
      <span class="hint-desktop">クリックして木を植える <i>·</i> ドラッグで見わたす <i>·</i> ホイールで近づく</span>
    </div>

    <footer class="hud-bottom">
      <div class="counter" id="counter" aria-live="polite">
        <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4c-7.2.3-13 3.4-13.6 9.1-.2 2.2.7 4.2 2.5 5.3C12.3 20.7 18.6 16 20 4Z"/><path d="M4.5 20c1.6-4.7 4.8-8.2 9.5-10.5"/></svg>
        <span><b id="tree-count">0</b><small>本</small></span>
      </div>

      <div class="time-panel" role="radiogroup" aria-label="時間帯">
        <button type="button" role="radio" data-time="dawn" aria-checked="false"><i class="dot dot-dawn"></i><span>朝</span></button>
        <button type="button" role="radio" data-time="day" aria-checked="false"><i class="dot dot-day"></i><span>昼</span></button>
        <button type="button" role="radio" data-time="dusk" aria-checked="false"><i class="dot dot-dusk"></i><span>夕</span></button>
        <button type="button" role="radio" data-time="night" aria-checked="false"><i class="dot dot-night"></i><span>夜</span></button>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="fallback" id="fallback" hidden>
      <h2>この森をひらけませんでした</h2>
      <p>WebGL に対応したブラウザでお試しください。</p>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
